stages:
  - validate
  - test
  - build
  - security

variables:
  CARGO_TERM_COLOR: always

validate:policy-and-assets:
  stage: validate
  image: node:22-alpine
  pull_policy: [if-not-present, always]
  script:
    - node scripts/bob-sync.mjs validate

test:rust-and-mcp:
  stage: test
  image: rust:1.85-slim
  pull_policy: [if-not-present, always]
  script:
    - cargo test --locked || cargo test

build:release:
  stage: build
  image: rust:1.85-slim
  pull_policy: [if-not-present, always]
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/bob-tuner*
    expire_in: 7 days

security:dlp-audit:
  stage: security
  image: node:22-alpine
  pull_policy: [if-not-present, always]
  script:
    - node scripts/bob-sync.mjs dlp-audit
