[package]
name = "bob-tuner"
version = "1.0.0"
edition = "2021"
authors = ["Erik Tonon"]
license = "MIT"
description = "Native tuning, PE-AGENTS-IBM compiler, safe Turbo Mode, and standalone MCP server for IBM Bob v2.1.0+"
repository = "https://github.com/eriktonon/ibm-bob-tuning"

[[bin]]
name = "bob-tuner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
